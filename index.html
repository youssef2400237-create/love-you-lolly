<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Love You Lolly</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- Ambient Light Rays & Background Layers -->
  <div class="ambient-glow"></div>
  <canvas id="ambient-canvas"></canvas>
  <div id="petal-container" aria-hidden="true"></div>

  <!-- Opening Animation Overlay -->
  <div id="intro-overlay" class="intro-overlay" aria-live="polite">
    <div class="flower-wrapper">
      <svg class="rose-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="rose-grad-center" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fda4af" />
            <stop offset="60%" stop-color="#e11d48" />
            <stop offset="100%" stop-color="#881337" />
          </radialGradient>
          <radialGradient id="rose-grad-outer" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fb7185" />
            <stop offset="70%" stop-color="#be123c" />
            <stop offset="100%" stop-color="#4c0519" />
          </radialGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Glow Base -->
        <circle cx="100" cy="100" r="45" fill="url(#rose-grad-center)" opacity="0.4" filter="url(#glow)" />

        <!-- Stem & Sepals -->
        <path class="stem" d="M100 130 Q100 165 95 190" stroke="#15803d" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path class="sepal sepal-left" d="M100 130 C85 135 75 125 70 120 C80 128 95 130 100 130 Z" fill="#166534" />
        <path class="sepal sepal-right" d="M100 130 C115 135 125 125 130 120 C120 128 105 130 100 130 Z" fill="#166534" />

        <!-- Outer Petals Layer 3 -->
        <path class="petal petal-outer-left" d="M100 130 C60 120 40 85 65 55 C90 70 98 105 100 130 Z" fill="url(#rose-grad-outer)" />
        <path class="petal petal-outer-right" d="M100 130 C140 120 160 85 135 55 C110 70 102 105 100 130 Z" fill="url(#rose-grad-outer)" />

        <!-- Mid Petals Layer 2 -->
        <path class="petal petal-mid-left" d="M100 130 C70 115 55 80 80 60 C95 75 98 110 100 130 Z" fill="url(#rose-grad-center)" />
        <path class="petal petal-mid-right" d="M100 130 C130 115 145 80 120 60 C105 75 102 110 100 130 Z" fill="url(#rose-grad-center)" />

        <!-- Inner Petals Layer 1 -->
        <path class="petal petal-inner-left" d="M100 130 C80 110 70 85 90 70 C100 80 100 110 100 130 Z" fill="url(#rose-grad-center)" />
        <path class="petal petal-inner-right" d="M100 130 C120 110 130 85 110 70 C100 80 100 110 100 130 Z" fill="url(#rose-grad-center)" />

        <!-- Central Bud Core -->
        <path class="petal petal-core" d="M100 130 C88 115 85 82 100 75 C115 82 112 115 100 130 Z" fill="#fda4af" />
      </svg>
    </div>
  </div>

  <!-- Main Romantic Content -->
  <main id="main-content" class="main-content hidden" aria-hidden="true">
    <div class="content-card">
      <div class="image-frame">
        <!-- Replace your photo at ./assets/images/love.jpg -->
        <img 
          id="love-photo" 
          src="./assets/images/unnamed.jpg" 
          alt="Romantic Memory"
          onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'600\' height=\'600\' viewBox=\'0 0 600 600\'><rect width=\'100%\' height=\'100%\' fill=\'%233d081b\'/><text x=\'50%\' y=\'50%\' fill=\'%23f472b6\' font-family=\'sans-serif\' font-size=\'24\' text-anchor=\'middle\'>Add your image at assets/images/love.jpg</text></svg>';" 
        />
        <div class="frame-glow"></div>
      </div>
      <h1 class="romantic-text">Love you for ever my home ❤️🫂</h1>
    </div>
  </main>

  <!-- Audio Element -->
  <!-- Replace your music file at ./assets/audio/love-song.mp3 -->
  <audio id="bg-music" loop preload="auto">
    <source src="./assets/audio/sting - shape of my heart (slowed + reverb).mp3" type="audio/mpeg" />
  </audio>

  <!-- Glassmorphism Music Control Bar -->
  <nav class="music-player" aria-label="Audio Controls">
    <div class="player-content">
      <button id="btn-play" class="control-btn" aria-label="Play or Pause Music">
        <svg id="icon-play" class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" class="icon hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <div class="equalizer" id="equalizer" aria-hidden="true">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>

      <div class="volume-container">
        <button id="btn-mute" class="control-btn" aria-label="Mute or Unmute">
          <svg id="icon-volume" class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="icon-muted" class="icon hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" aria-label="Volume Slider" />
      </div>
    </div>
  </nav>

  <script src="./script.js"></script>
</body>
</html>
